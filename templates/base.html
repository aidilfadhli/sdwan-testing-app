<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Mass Testing SD-WAN{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script>
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
</script>
</head>
<body>
<header class="topbar">
  <div class="brand-container">
    <img src="/static/assets/img/logo.png" alt="Telkom Logo" class="brand-logo">
    <a href="/" class="brand">Mass Testing SD-WAN</a>
  </div>
  <div class="topbar-right">
    <nav class="nav-menu" id="nav-menu">
      <a href="/form" class="btn primary small"><i data-lucide="plus" class="icon"></i> Uji Baru</a>
      <a href="/analytics" class="btn small"><i data-lucide="bar-chart-2" class="icon"></i> Analytics</a>
      <a href="/export" class="btn small" id="topbar-export-btn" title="Export Excel">
        <i data-lucide="download" class="icon"></i> <span class="hide-mobile">Export Excel</span>
      </a>
      <a href="/settings" class="btn small"><i data-lucide="settings" class="icon"></i> Pengaturan</a>
    </nav>
    <button type="button" class="btn small" id="theme-toggle" title="Ganti Tema">
      <i data-lucide="moon" class="icon"></i>
    </button>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
<div id="scanmodal" hidden>
  <div class="scanpanel">
    <div class="scanhead">
      <strong><i data-lucide="camera" class="icon"></i> Arahkan kamera ke barcode S/N</strong>
      <button type="button" class="btn small" onclick="closeScan()"><i data-lucide="x" class="icon"></i> Tutup</button>
    </div>
    <div id="qrreader"></div>
  </div>
</div>

<div id="pin-modal" class="pin-modal" hidden>
  <div class="pin-panel">
    <div class="pin-head">
      <div class="pin-icon-wrap"><i data-lucide="shield-alert" class="icon pin-icon"></i></div>
      <strong>Konfirmasi Supervisor</strong>
    </div>
    <p id="pin-message">Masukkan PIN supervisor untuk melanjutkan:</p>
    <form id="pin-form" onsubmit="handlePinSubmit(event)">
      <input type="password" id="pin-input" placeholder="Masukkan PIN…" required autocomplete="off">
      <div class="pin-actions">
        <button type="button" class="btn" onclick="closePinModal()">Batal</button>
        <button type="submit" class="btn danger"><i data-lucide="check-circle" class="icon"></i> Konfirmasi</button>
      </div>
    </form>
  </div>
</div>

<div id="confirm-modal" class="pin-modal" hidden>
  <div class="pin-panel">
    <div class="pin-head">
      <div class="pin-icon-wrap" style="background: rgba(237, 28, 36, 0.1); color: var(--primary);">
        <i data-lucide="help-circle" class="icon pin-icon"></i>
      </div>
      <strong id="confirm-title">Konfirmasi Hapus</strong>
    </div>
    <p id="confirm-message" style="margin-top: 10px; font-size: 0.95rem; color: var(--text-main); text-align: center; line-height: 1.4;"></p>
    <div class="pin-actions" style="margin-top: 16px;">
      <button type="button" class="btn" onclick="closeConfirmModal(false)">Batal</button>
      <button type="button" class="btn danger" onclick="closeConfirmModal(true)">
        <i data-lucide="check-circle" class="icon"></i> Ya, Lanjutkan
      </button>
    </div>
  </div>
</div>

<nav class="mobile-bottom-nav">
  <a href="/" class="nav-item">
    <i data-lucide="home" class="icon"></i>
    <span>Beranda</span>
  </a>
  <a href="/analytics" class="nav-item">
    <i data-lucide="bar-chart-2" class="icon"></i>
    <span>Analytics</span>
  </a>
  <a href="/form" class="nav-item fab">
    <div class="fab-inner">
      <i data-lucide="plus" class="icon"></i>
    </div>
  </a>
  <a href="/export" class="nav-item">
    <i data-lucide="download" class="icon"></i>
    <span>Ekspor</span>
  </a>
  <a href="/settings" class="nav-item">
    <i data-lucide="settings" class="icon"></i>
    <span>Settings</span>
  </a>
</nav>

<div id="backup-toast" class="backup-toast-container" hidden>
  <div class="backup-toast-card">
    <div class="backup-toast-header">
      <div class="backup-toast-icon">
        <i data-lucide="archive" class="icon spin"></i>
      </div>
      <div class="backup-toast-title-wrap">
        <strong id="backup-toast-title">Proses Backup Data...</strong>
        <span id="backup-toast-status">Menyiapkan berkas backup...</span>
      </div>
      <span id="backup-toast-percent" class="backup-toast-percent">0%</span>
    </div>
    <div class="backup-progress-bar-bg">
      <div id="backup-progress-bar" class="backup-progress-bar-fill" style="width: 0%;"></div>
    </div>
  </div>
</div>

<script src="/static/html5-qrcode.min.js"></script>
<script src="/static/scanner.js"></script>
<script>
  lucide.createIcons();
  
  const themeToggle = document.getElementById('theme-toggle');
  function updateThemeIcon() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    themeToggle.innerHTML = `<i data-lucide="${isDark ? 'sun' : 'moon'}" class="icon"></i>`;
    lucide.createIcons({ nameAttr: 'data-lucide' });
  }
  if (themeToggle) {
    updateThemeIcon();
    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const newTheme = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeIcon();
    });
  }

  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const res = await fetch('/api/backup/status');
      const data = await res.json();
      if (data && data.status === 'running') {
        startBackupProgressToast();
      }
    } catch (e) {}
  });

  /* Toast Progress Backup Handler */
  let backupPollTimer = null;

  function showBackupToast(title, statusText, percent) {
    const toast = document.getElementById('backup-toast');
    const titleEl = document.getElementById('backup-toast-title');
    const statusEl = document.getElementById('backup-toast-status');
    const percentEl = document.getElementById('backup-toast-percent');
    const barEl = document.getElementById('backup-progress-bar');
    if (!toast) return;

    toast.hidden = false;
    if (titleEl && title) titleEl.textContent = title;
    if (statusEl && statusText) statusEl.textContent = statusText;
    if (percentEl) percentEl.textContent = `${percent}%`;
    if (barEl) barEl.style.width = `${percent}%`;
  }

  function hideBackupToast() {
    const toast = document.getElementById('backup-toast');
    if (toast) {
      setTimeout(() => { toast.hidden = true; }, 1800);
    }
  }

  function startBackupProgressToast() {
    if (backupPollTimer) clearInterval(backupPollTimer);
    showBackupToast('Proses Backup Data...', 'Menyiapkan berkas...', 5);

    backupPollTimer = setInterval(async () => {
      try {
        const res = await fetch('/api/backup/status');
        const data = await res.json();
        
        showBackupToast('Proses Backup Data...', data.message, data.progress);

        if (data.status === 'completed' || data.progress >= 100) {
          clearInterval(backupPollTimer);
          backupPollTimer = null;
          showBackupToast('Backup Selesai!', 'File backup berhasil disimpan!', 100);
          if (typeof window.loadBackupHistory === 'function') {
            window.loadBackupHistory();
          }
          hideBackupToast();
        } else if (data.status === 'error') {
          clearInterval(backupPollTimer);
          backupPollTimer = null;
          showBackupToast('Backup Gagal', data.message || 'Terjadi kesalahan saat backup', 0);
          hideBackupToast();
        }
      } catch (e) {
        // Retry
      }
    }, 150);
  }

  /* Custom Confirm Modal Handler */
  let confirmResolver = null;
  const confirmModal = document.getElementById('confirm-modal');
  const confirmTitle = document.getElementById('confirm-title');
  const confirmMessage = document.getElementById('confirm-message');

  function requestConfirm(title, msg) {
    return new Promise((resolve) => {
      if (confirmTitle) confirmTitle.textContent = title || 'Konfirmasi';
      if (confirmMessage) confirmMessage.textContent = msg || 'Apakah Anda yakin ingin melanjutkan?';
      if (confirmModal) confirmModal.hidden = false;
      confirmResolver = resolve;
      if (window.lucide) lucide.createIcons();
    });
  }

  function closeConfirmModal(res) {
    if (confirmModal) confirmModal.hidden = true;
    if (confirmResolver) {
      confirmResolver(res);
      confirmResolver = null;
    }
  }

  /* Custom PIN Modal Handler */
  let pinResolver = null;
  const pinModal = document.getElementById('pin-modal');
  const pinInput = document.getElementById('pin-input');
  const pinMessage = document.getElementById('pin-message');

  function requestPin(msg) {
    return new Promise((resolve) => {
      if (pinMessage) pinMessage.textContent = msg;
      if (pinInput) pinInput.value = '';
      if (pinModal) pinModal.hidden = false;
      setTimeout(() => pinInput && pinInput.focus(), 100);
      pinResolver = resolve;
      if (window.lucide) lucide.createIcons();
    });
  }

  function handlePinSubmit(e) {
    e.preventDefault();
    const val = pinInput ? pinInput.value.trim() : '';
    if (pinModal) pinModal.hidden = true;
    if (pinResolver) {
      pinResolver(val);
      pinResolver = null;
    }
  }

  function closePinModal() {
    if (pinModal) pinModal.hidden = true;
    if (pinResolver) {
      pinResolver(null);
      pinResolver = null;
    }
  }
</script>
</body>
</html>
